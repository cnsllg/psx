<!doctype html>
<html lang="en" manifest="cache.manifest">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSSFontFace exploit</title>
    <link rel="stylesheet" href="includes/style.css" />
    <style>
      .active {
        background-color: #16a34a !important;
        border-color: #15803d !important;
      }
      .collapsed {
        display: none !important;
      }
    </style>
  </head>
  <body class="h-screen w-screen overflow-hidden bg-gray-900 text-gray-200 font-sans flex select-none">
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="absolute bottom-4 right-4 flex flex-col gap-2 z-50 pointer-events-none"></div>

    <!-- LEFT PANEL: Controls & Info -->
    <div class="flex-1 flex flex-col bg-gray-900 border-r border-gray-700 h-full">
      <div class="p-4 border-b border-gray-700 flex justify-between items-start">
        <div>
          <h1 class="text-xl font-bold text-white mb-1">CSSFontFace UAF</h1>
          <div class="text-xs text-gray-400 mb-1">
            Firmware: <span id="fw-ver" class="text-white font-bold">Detecting...</span>
          </div>
          <div class="text-xs text-gray-400">
            Mode: <span id="status-text" class="font-bold text-blue-400">Checking...</span>
          </div>
        </div>
        <button
          id="clear-cache-btn"
          class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-1 px-2 rounded transition-colors"
        >
          Clear Cache
        </button>
      </div>

      <div class="p-4 border-b border-gray-700">
        <div class="text-xs text-gray-400 mb-2 font-bold uppercase tracking-wider">Exploit Chain</div>
        <div class="flex gap-2 mb-4" id="kernel-options">
          <button
            id="netctrl-btn"
            class="flex-1 bg-gray-800 hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed rounded py-2 text-sm font-bold text-white transition-colors"
            disabled
          >
            NetCtrl
          </button>
          <button
            id="lapse-btn"
            class="flex-1 bg-gray-800 hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed rounded py-2 text-sm font-bold text-white transition-colors"
            disabled
          >
            Lapse
          </button>
        </div>

        <button
          id="jeilbrek"
          disabled
          class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold py-2 rounded mb-3 transition-colors"
        >
          Jeilbrek
        </button>

        <div class="flex gap-2 mb-3">
          <button
            id="autoJbBtn"
            class="flex-1 bg-gray-800 hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed border border-gray-600 rounded py-2 text-xs font-semibold text-white transition-colors"
            disabled
          >
            Auto: OFF
          </button>
          <button
            id="instantJbBtn"
            class="flex-1 bg-gray-800 hover:bg-gray-700 disabled:opacity-50 disabled:cursor-not-allowed border border-gray-600 rounded py-2 text-xs font-semibold text-white transition-colors"
            disabled
          >
            Instant: OFF
          </button>
        </div>

        <div class="text-xs text-gray-400 flex justify-between">
          <span>Pass: <strong id="pass-count" class="text-green-500">0</strong></span>
          <span>Fail: <strong id="fail-count" class="text-red-500">0</strong></span>
        </div>
      </div>

      <div id="payloads-section" class="flex-1 flex flex-col overflow-hidden">
        <div class="p-4 pb-2 border-b border-gray-700">
          <h2 class="text-sm font-bold text-blue-400 uppercase tracking-wider">Available Payloads</h2>
        </div>
        <div id="payloads-list" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
          <p class="empty-msg text-xs text-gray-500 italic">Loading payloads from manifest...</p>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Console -->
    <div id="console-section" class="w-3/5 flex flex-col bg-black h-full">
      <div
        id="console-header"
        class="bg-gray-800 px-4 py-2 flex justify-between items-center border-b border-gray-700 select-none"
      >
        <span class="text-xs font-bold text-blue-400">System Console Log</span>
      </div>
      <pre
        id="console"
        class="flex-1 overflow-y-auto p-4 text-xs text-green-400 font-mono break-words whitespace-pre-wrap"
      >Initializing cache...<br/></pre>
    </div>

    <script src="src/manifest.js"></script>
    <script src="src/main.js"></script>
    <script src="includes/script.js"></script>
  </body>
</html>
